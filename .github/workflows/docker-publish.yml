# AIO 镜像发布（Docker Hub renxqoo/tillgate）：
#   push main / push v* 标签 / 手动触发 → 统一推 renxqoo/tillgate:latest
#   （单一标签，每次发布覆盖；不做版本/sha/日期后缀标签）
#   PR 阶段不执行（无 pull_request 触发）——合并进 main 的 push 才构建发布
# Secrets（repo Settings → Secrets → Actions）：DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
#（Docker Hub Access Token；缺失时 main 推送会响亮失败——发布不允许静默跳过）
# 多容器 compose 形态不在此发布：按 docs/deployment.md 从源码构建。
name: docker-publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    name: build & push AIO (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Docker Hub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        # 发布统一单标签 renxqoo/tillgate:latest（tag/主线/手动触发同口径）
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_REF" == refs/heads/main ]]; then
            echo "tags=renxqoo/tillgate:latest" >> "$GITHUB_OUTPUT"
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            # 非主线分支手动触发：只构建验证（占位 tag 不推送）
            echo "tags=tillgate/aio:pr-check" >> "$GITHUB_OUTPUT"
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build AIO image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.aio
          platforms: linux/amd64
          push: ${{ steps.tags.outputs.push == 'true' }}
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
