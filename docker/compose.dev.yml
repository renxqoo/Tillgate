# 本地开发：仅基础设施（应用在宿主机 bun dev 运行）
x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  redis:
    image: redis:7-alpine
    # 与根 .env 的 REDIS_URL 密码对齐（compose.yml 同款：requirepass 必开，默认仅开发）
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:-root123}']
    ports:
      - '127.0.0.1:6379:6379' # 仅回环：宿主机 bun dev 直连；0.0.0.0 会把带弱默认口令的 Redis 暴露给局域网
    volumes:
      - redis-dev:/data
    healthcheck:
      # 带鉴权 ping（requirepass 启用后无密码 ping 返回 NOAUTH）
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-root123}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tillgate}
    ports:
      - '127.0.0.1:5432:5432' # 仅回环：同上，避免局域网可达
    volumes:
      - pg-dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tillgate}']
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

volumes:
  redis-dev:
  pg-dev:
