# 单机 HA 形态（阶段二·容器级）：redis 主从 + sentinel×3 自动切换、应用双副本、PG WAL 归档。
# 用法：docker compose --env-file .env -f docker/compose.yml -f docker/compose.ha.yml up -d --build
# 边界（诚实声明）：单机形态防「组件故障」（进程崩/容器死/OOM/发布事故），
# 不防「机器级故障」（整机死/磁盘损坏）——后者走 docs/ha-deployment.md 的双机升级路径
# 与 WAL 异机归档。双机时本文件的容器拆到两台机即可（配置零改动）。
#
# 关键语义：
# - 所有 Redis 消费进程经 REDIS_SENTINELS 走 sentinel 发现主库；
#   REDIS_URL 仅承载密码/db 凭证。
# - sentinel quorum=2/3：主库失联 5s 判死，15s 内完成切换，应用自动跟随新主。
# - nginx upstream 写的是服务名：docker DNS 对多副本返回多条 A 记录，
#   nginx 启动时全部纳入 + 被动健康检查（max_fails）摘除故障副本。

x-sentinel: &sentinel
  image: redis:7-alpine
  environment:
    REDIS_MASTER_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    REDISCLI_AUTH: ${REDIS_SENTINEL_PASSWORD:?REDIS_SENTINEL_PASSWORD is required for HA}
  entrypoint:
    - sh
    - -ec
    - |
      if [ ! -s /data/sentinel.conf ]; then
        cat > /data/sentinel.conf <<EOF
      port 26379
      requirepass "$${REDISCLI_AUTH}"
      sentinel resolve-hostnames yes
      sentinel announce-hostnames yes
      sentinel monitor mymaster redis 6379 2
      sentinel auth-pass mymaster "$${REDIS_MASTER_PASSWORD}"
      sentinel down-after-milliseconds mymaster 5000
      sentinel failover-timeout mymaster 15000
      sentinel parallel-syncs mymaster 1
      EOF
      fi
      chown -R redis:redis /data
      exec su-exec redis redis-server /data/sentinel.conf --sentinel
  depends_on:
    redis:
      condition: service_healthy
  healthcheck:
    test: ['CMD-SHELL', 'redis-cli -p 26379 ping | grep -q PONG']
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 5s
  restart: unless-stopped

services:
  # ── Redis 主从 + sentinel 仲裁 ──────────────────────────────
  redis:
    # 主库（沿用原服务名：REDIS_URL 凭证指向它；实际路由由 sentinel 接管）
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?REDIS_PASSWORD is required}',
      ]

  redis-replica:
    image: redis:7-alpine
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - '${REDIS_PASSWORD:?REDIS_PASSWORD is required}'
      - --replicaof
      - redis
      - '6379'
      - --masterauth
      - '${REDIS_PASSWORD:?REDIS_PASSWORD is required}'
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-replica-data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  sentinel-1:
    <<: *sentinel
    volumes:
      - sentinel-1-data:/data

  sentinel-2:
    <<: *sentinel
    volumes:
      - sentinel-2-data:/data

  sentinel-3:
    <<: *sentinel
    volumes:
      - sentinel-3-data:/data

  # ── 应用双副本：任一副本故障，nginx 被动摘除，另一副本继续服务 ──
  gateway:
    deploy:
      replicas: 2
    environment:
      REDIS_SENTINELS: 'sentinel-1:26379,sentinel-2:26379,sentinel-3:26379'
      REDIS_SENTINEL_NAME: mymaster
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:?REDIS_SENTINEL_PASSWORD is required for HA}

  client-api:
    deploy:
      replicas: 2
    environment:
      REDIS_SENTINELS: 'sentinel-1:26379,sentinel-2:26379,sentinel-3:26379'
      REDIS_SENTINEL_NAME: mymaster
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:?REDIS_SENTINEL_PASSWORD is required for HA}

  admin-api:
    deploy:
      replicas: 2
    environment:
      REDIS_SENTINELS: 'sentinel-1:26379,sentinel-2:26379,sentinel-3:26379'
      REDIS_SENTINEL_NAME: mymaster
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:?REDIS_SENTINEL_PASSWORD is required for HA}

  trace-receiver:
    deploy:
      replicas: 2

  # worker 单副本：结算认领 SKIP LOCKED 多实例安全，但单机双副本无增益
  # （批处理吞吐由 batchSize 决定）；双机形态可 scale worker=2 分摊
  worker:
    environment:
      REDIS_SENTINELS: 'sentinel-1:26379,sentinel-2:26379,sentinel-3:26379'
      REDIS_SENTINEL_NAME: mymaster
      REDIS_SENTINEL_PASSWORD: ${REDIS_SENTINEL_PASSWORD:?REDIS_SENTINEL_PASSWORD is required for HA}

  console-client:
    deploy:
      replicas: 2
  console-admin:
    deploy:
      replicas: 2

  # ── PG：WAL 归档卷（本地卷 + 手册 cron 推对象存储 = 盘坏时 RPO 分钟级）──
  postgres:
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=test ! -f /archive/%f && cp %p /archive/.%f.tmp && mv /archive/.%f.tmp /archive/%f
      - -c
      - archive_timeout=300
    volumes:
      - pg-data:/var/lib/postgresql/data
      - pg-archive:/archive

volumes:
  pg-archive:
  redis-replica-data:
  sentinel-1-data:
  sentinel-2-data:
  sentinel-3-data:
