# 生产编排（tech-stack.md §4）
# 链路追踪走内置 trace-receiver（PG 存储 + 管理台「链路追踪」页）：启用时各服务
# 链路追踪默认开启（OTEL_TRACES_MODE 缺省 otlp）；关闭设 off。端点缺省指向 trace-receiver:8793。

name: tillgate

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

services:
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443' # TLS（证书由 certbot 签发，挂载 letsencrypt 卷）
      - '8443:8443' # admin IP 直达入口（nginx.conf 同名 server 块;无 admin.* DNS 的场景）
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-web:/var/www/certbot:ro
    depends_on:
      gateway:
        condition: service_healthy
      client-api:
        condition: service_healthy
      admin-api:
        condition: service_healthy
      console-client:
        condition: service_healthy
      console-admin:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 64m

  # certbot 证书签发与续期（Let's Encrypt）——本服务 entrypoint 为 sleep 常驻，
  # 签发/续期须显式指定 --entrypoint certbot（或用 exec）：
  # 首次签发（standalone——此时 80 端口空闲、nginx 未起；--cert-name gateway 对齐 nginx 挂载路径）：
  #   docker compose --env-file .env -f docker/compose.yml run --rm --entrypoint certbot -p 80:80 certbot certonly \
  #     --standalone --cert-name gateway -d app.xxx.com -d admin.xxx.com --email you@xxx.com --agree-tos --no-eff-email
  # 续期（webroot——nginx 已在跑、ACME 路径直出）：
  #   docker compose --env-file .env -f docker/compose.yml exec certbot certbot renew --webroot -w /var/www/certbot \
  #     && docker compose --env-file .env -f docker/compose.yml exec nginx nginx -s reload
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-web:/var/www/certbot
    entrypoint: sleep infinity # 常驻，由 cron/手动触发 renew
    logging: *default-logging
    restart: unless-stopped

  gateway:
    # 生产镜像按 linux/amd64 构建（服务器 x86_64；本地 Apple Silicon 经 colima Rosetta 交叉构建）
    image: ${TILLGATE_IMAGE_PREFIX:-tillgate}/gateway:${TILLGATE_TAG:-local}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        APP: gateway
    env_file:
      - path: ../.env
        required: true
    environment:
      # 锁定生产形态:compose environment 优先级高于 env_file,防 .env 里的
      # NODE_ENV=development(本地 dev 值)覆盖镜像 ENV——development 会启用
      # pino-pretty worker transport,在 bundle 产物里 thread-stream 崩溃
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-tillgate}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      GATEWAY_PORT: 8080
      OTEL_TRACES_MODE: ${OTEL_TRACES_MODE:-otlp}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://trace-receiver:8793}
      # OTLP Bearer——与 trace-receiver 共用同键；缺此值 span 全部 401 拒收
      TRACE_RECEIVER_TOKEN: ${TRACE_RECEIVER_TOKEN:?TRACE_RECEIVER_TOKEN is required}
      TRUSTED_PROXY_HOPS: '1' # nginx 单层代理：XFF 右数第 1 跳 = 真实客户端
      ADMIN_JWT_SECRET:
      IDENTITY_CODE_PEPPER:
      CLIENT_CODE_PEPPER:
      POSTGRES_PASSWORD:
      REDIS_PASSWORD:
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        # 空库起服务 = 启动期 DB 探测失败后的僵死态(不自动恢复,登录等服务全挂)——
        # 迁移链完成才放行后端服务;migrate 幂等,重复 up 直接跳过已应用项
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/readyz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt: ['no-new-privileges:true']
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 384m
    stop_grace_period: 30s # 优雅关停：给 in-flight SSE/请求足够 drain 时间
    # 多副本：docker compose --env-file .env -f docker/compose.yml up -d --scale gateway=2

  client-api:
    image: ${TILLGATE_IMAGE_PREFIX:-tillgate}/client-api:${TILLGATE_TAG:-local}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        APP: client-api
    env_file:
      - path: ../.env
        required: true
    environment:
      NODE_ENV: production # 防 .env 的 dev 值覆盖镜像 ENV(pino-pretty worker 在 bundle 里崩溃)
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-tillgate}
      TRUSTED_PROXY_HOPS: '1' # 经 FE BFF 透传的 XFF（右数第 1 跳 = 真实用户 IP）
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      OTEL_TRACES_MODE: ${OTEL_TRACES_MODE:-otlp}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://trace-receiver:8793}
      ADMIN_JWT_SECRET:
      IDENTITY_CODE_PEPPER:
      POSTGRES_PASSWORD:
      REDIS_PASSWORD:
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        # 空库起服务 = 启动期 DB 探测失败后的僵死态(不自动恢复,登录等服务全挂)——
        # 迁移链完成才放行后端服务;migrate 幂等,重复 up 直接跳过已应用项
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8081/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt: ['no-new-privileges:true']
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 384m
    stop_grace_period: 15s

  admin-api:
    image: ${TILLGATE_IMAGE_PREFIX:-tillgate}/admin-api:${TILLGATE_TAG:-local}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        APP: admin-api
    env_file:
      - path: ../.env
        required: true
    environment:
      NODE_ENV: production # 防 .env 的 dev 值覆盖镜像 ENV(pino-pretty worker 在 bundle 里崩溃)
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-tillgate}
      TRUSTED_PROXY_HOPS: '1' # 经 FE BFF 透传的 XFF（右数第 1 跳 = 真实用户 IP）
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      OTEL_TRACES_MODE: ${OTEL_TRACES_MODE:-otlp}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://trace-receiver:8793}
      CLIENT_CODE_PEPPER:
      POSTGRES_PASSWORD:
      REDIS_PASSWORD:
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        # 空库起服务 = 启动期 DB 探测失败后的僵死态(不自动恢复,登录等服务全挂)——
        # 迁移链完成才放行后端服务;migrate 幂等,重复 up 直接跳过已应用项
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8082/readyz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt: ['no-new-privileges:true']
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 384m
    stop_grace_period: 15s

  worker:
    image: ${TILLGATE_IMAGE_PREFIX:-tillgate}/worker:${TILLGATE_TAG:-local}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        APP: worker
    env_file:
      - path: ../.env
        required: true
    environment:
      NODE_ENV: production # 防 .env 的 dev 值覆盖镜像 ENV(pino-pretty worker 在 bundle 里崩溃)
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-tillgate}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379
      OTEL_TRACES_MODE: ${OTEL_TRACES_MODE:-otlp}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://trace-receiver:8793}
      TRACE_RECEIVER_TOKEN: ${TRACE_RECEIVER_TOKEN:?TRACE_RECEIVER_TOKEN is required}
      JWT_SECRET:
      ADMIN_JWT_SECRET:
      IDENTITY_CODE_PEPPER:
      CLIENT_CODE_PEPPER:
      POSTGRES_PASSWORD:
      REDIS_PASSWORD:
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        # 空库起服务 = 启动期 DB 探测失败后的僵死态(不自动恢复,登录等服务全挂)——
        # 迁移链完成才放行后端服务;migrate 幂等,重复 up 直接跳过已应用项
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8792/readyz']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt: ['no-new-privileges:true']
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 384m
    stop_grace_period: 30s

  # 链路接收端（内网）：OTLP/HTTP JSON → PG trace_spans 日分区；
  # 各服务通过 OTEL_TRACES_MODE=otlp + endpoint 指向它（见下方 environment 注入）。
  trace-receiver:
    image: ${TILLGATE_IMAGE_PREFIX:-tillgate}/trace-receiver:${TILLGATE_TAG:-local}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        APP: trace-receiver
    environment:
      NODE_ENV: production # 防 .env 的 dev 值覆盖镜像 ENV(pino-pretty worker 在 bundle 里崩溃)
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-tillgate}
      TRACE_RECEIVER_TOKEN: ${TRACE_RECEIVER_TOKEN:?TRACE_RECEIVER_TOKEN is required}
      TRACE_RECEIVER_PORT: ${TRACE_RECEIVER_PORT:-8793}
      TRACE_BATCH_MAX: ${TRACE_BATCH_MAX:-500}
      TRACE_FLUSH_INTERVAL_MS: ${TRACE_FLUSH_INTERVAL_MS:-2000}
      TRACE_QUEUE_MAX: ${TRACE_QUEUE_MAX:-10000}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION:-0.1.0}
      OTEL_METRICS_INTERVAL_MS: ${OTEL_METRICS_INTERVAL_MS:-10000}
      OTEL_TRACES_MODE: 'off' # 接收端自身不再导出（防自环）
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully # 同其余后端:迁移完成才启动(空库启动=僵死态)
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8793/readyz']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt: ['no-new-privileges:true']
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 192m

  console-client:
    image: ${TILLGATE_IMAGE_PREFIX:-tillgate}/console-client:${TILLGATE_TAG:-local}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: apps/client/Dockerfile
      args:
        GATEWAY_BASE: http://gateway:8080
        NEXT_PUBLIC_DISPLAY_TZ: ${NEXT_PUBLIC_DISPLAY_TZ:-Asia/Shanghai}
    environment:
      NODE_ENV: production # 防 .env 的 dev 值覆盖镜像 ENV(Next standalone 以生产模式跑)
      # 后端（用户面 8081）
      CLIENT_API_BASE: http://client-api:8081
      TRUSTED_PROXY_HOPS: '1' # FE 在 nginx 后：解入站 XFF 供 BFF 透传给 API
    depends_on:
      client-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3001/']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    security_opt: ['no-new-privileges:true']
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 768m

  console-admin:
    image: ${TILLGATE_IMAGE_PREFIX:-tillgate}/console-admin:${TILLGATE_TAG:-local}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    environment:
      NODE_ENV: production # 防 .env 的 dev 值覆盖镜像 ENV(Next standalone 以生产模式跑)
      # 后端（管理面 8082）
      ADMIN_API_BASE: http://admin-api:8082
      TRUSTED_PROXY_HOPS: '1' # FE 在 nginx 后：解入站 XFF 供 BFF 透传给 API
    depends_on:
      admin-api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:3002/']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    security_opt: ['no-new-privileges:true']
    logging: *default-logging
    restart: unless-stopped
    mem_limit: 512m

  migrate:
    image: ${TILLGATE_IMAGE_PREFIX:-tillgate}/migrate:${TILLGATE_TAG:-local}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.migrate
    environment:
      # 同其余服务:容器网地址覆盖 env_file 的宿主机形态(localhost 在容器内指向自身,
      # 缺此覆盖时 drizzle-kit 静默失败——进度条后 exit 1,库零表)
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-tillgate}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'
    mem_limit: 256m
    security_opt: ['no-new-privileges:true']
    logging: *default-logging

  redis:
    image: redis:7-alpine
    # B3 修复：启用 requirepass（与 REDIS_URL 的密码对齐），生产 Redis 不裸奔。
    # REDIS_PASSWORD 来自 .env，生产必须显式配置。
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?REDIS_PASSWORD is required}',
      ]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis-data:/data
    healthcheck:
      # 带鉴权 ping（requirepass 启用后无密码 ping 返回 NOAUTH）
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 256m
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-tillgate}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tillgate}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    mem_limit: 512m
    logging: *default-logging

volumes:
  redis-data:
  pg-data:
  certbot-etc: # TLS 证书（/etc/letsencrypt）
  certbot-web: # certbot webroot 验证（/var/www/certbot）
