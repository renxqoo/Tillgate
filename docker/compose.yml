# 生产编排（tech-stack.md §4）
# 观测栈使用 profile `obs`：docker compose --profile obs up -d

services:
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443' # TLS（证书由 certbot 签发，挂载 letsencrypt 卷）
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-web:/var/www/certbot:ro
    depends_on:
      - gateway
      - console
    restart: unless-stopped

  # certbot 证书签发与续期（Let's Encrypt）
  # 首次签发：docker compose run --rm certbot certonly --webroot -w /var/www/certbot -d your.domain.com
  # 自动续期：cron / compose run certbot renew（90 天到期前 30 天可续）
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-web:/var/www/certbot
    entrypoint: sleep infinity # 常驻，由 cron/手动触发 renew
    restart: unless-stopped

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        APP: gateway
    env_file:
      - path: ../.env
        required: true
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8787/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    # 多副本：docker compose up -d --scale gateway=2

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        APP: worker
    env_file:
      - path: ../.env
        required: true
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  admin-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        APP: admin-api
    env_file:
      - path: ../.env
        required: true
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # 安全：不发布任何端口，仅 compose 内网可达（console 服务端代理调用）

  console:
    build:
      context: ..
      dockerfile: apps/console-app/Dockerfile
    env_file:
      - path: ../.env
        required: true
    depends_on:
      - admin-api
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile.migrate
    env_file:
      - path: ../.env
        required: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_gateway}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_gateway}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── 观测栈（profile obs，默认不启动）──
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    profiles: ['obs']
    ports:
      - '4318:4318'  # OTLP HTTP（宿主机 gateway/worker/admin-api 推送到此）
      - '4317:4317'  # OTLP gRPC
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo
      - prometheus
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    profiles: ['obs']
    ports:
      - '9090:9090'  # Prometheus UI
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--storage.tsdb.retention.size=5GB'
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  tempo:
    image: grafana/tempo:latest
    profiles: ['obs']
    ports:
      - '3200:3200'  # Tempo UI / API（Grafana 查 trace 用）
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    profiles: ['obs']
    ports:
      - '3001:3000'
    environment:
      # 安全：关闭匿名访问（审计发现原配置匿名 Admin 暴露全量指标）
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      # 首次启动后手动创建管理员（或配 GF_SECURITY_ADMIN_PASSWORD）
      GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_ADMIN_PASSWORD:-changeme}'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - tempo
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
  certbot-etc: # TLS 证书（/etc/letsencrypt）
  certbot-web: # certbot webroot 验证（/var/www/certbot）
  prometheus-data: # 指标持久化（15 天保留 + 5GB 上限）
  tempo-data: # 链路追踪持久化（7 天保留）
