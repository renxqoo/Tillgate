# 生产编排（tech-stack.md §4）
# 链路追踪走内置 trace-receiver（PG 存储 + 管理台「链路追踪」页）：启用时各服务
# OTEL_TRACES_MODE 改 otlp，OTEL_EXPORTER_OTLP_ENDPOINT 指向 trace-receiver:8793。

name: tillgate

services:
  nginx:
    image: nginx:alpine
    ports:
      - '80:80'
      - '443:443' # TLS（证书由 certbot 签发，挂载 letsencrypt 卷）
      - '8443:8443' # admin IP 直达入口（nginx.conf 同名 server 块;无 admin.* DNS 的场景）
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-web:/var/www/certbot:ro
    depends_on:
      - gateway
      - console-client
      - console-admin
    restart: unless-stopped

  # certbot 证书签发与续期（Let's Encrypt）——本服务 entrypoint 为 sleep 常驻，
  # 签发/续期须显式指定 --entrypoint certbot（或用 exec）：
  # 首次签发（standalone——此时 80 端口空闲、nginx 未起；--cert-name gateway 对齐 nginx 挂载路径）：
  #   docker compose -f docker/compose.yml run --rm --entrypoint certbot -p 80:80 certbot certonly \
  #     --standalone --cert-name gateway -d app.xxx.com -d admin.xxx.com --email you@xxx.com --agree-tos --no-eff-email
  # 续期（webroot——nginx 已在跑、ACME 路径直出）：
  #   docker compose -f docker/compose.yml exec certbot certbot renew --webroot -w /var/www/certbot \
  #     && docker compose -f docker/compose.yml exec nginx nginx -s reload
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-web:/var/www/certbot
    entrypoint: sleep infinity # 常驻，由 cron/手动触发 renew
    restart: unless-stopped

  gateway:
    # 生产镜像按 linux/amd64 构建（服务器 x86_64；本地 Apple Silicon 经 colima Rosetta 交叉构建）
    image: tillgate/gateway:${TILLGATE_TAG:-local}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        APP: gateway
    env_file:
      - path: ../.env
        required: true
    environment:
      # 锁定生产形态:compose environment 优先级高于 env_file,防 .env 里的
      # NODE_ENV=development(本地 dev 值)覆盖镜像 ENV——development 会启用
      # pino-pretty worker transport,在 bundle 产物里 thread-stream 崩溃
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tillgate}
      REDIS_URL: redis://:${REDIS_PASSWORD:-root123}@redis:6379
      GATEWAY_PORT: 8080
      OTEL_TRACES_MODE: 'off'
      TRUSTED_PROXY_HOPS: '1' # nginx 单层代理：XFF 右数第 1 跳 = 真实客户端
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        # 空库起服务 = 启动期 DB 探测失败后的僵死态(不自动恢复,登录等服务全挂)——
        # 迁移链完成才放行后端服务;migrate 幂等,重复 up 直接跳过已应用项
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8080/readyz']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s # 优雅关停：给 in-flight SSE/请求足够 drain 时间
    # 多副本：docker compose up -d --scale gateway=2

  client-api:
    image: tillgate/client-api:${TILLGATE_TAG:-local}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        APP: client-api
    env_file:
      - path: ../.env
        required: true
    environment:
      NODE_ENV: production # 防 .env 的 dev 值覆盖镜像 ENV(pino-pretty worker 在 bundle 里崩溃)
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tillgate}
      TRUSTED_PROXY_HOPS: '1' # 经 FE BFF 透传的 XFF（右数第 1 跳 = 真实用户 IP）
      REDIS_URL: redis://:${REDIS_PASSWORD:-root123}@redis:6379
      OTEL_TRACES_MODE: 'off'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        # 空库起服务 = 启动期 DB 探测失败后的僵死态(不自动恢复,登录等服务全挂)——
        # 迁移链完成才放行后端服务;migrate 幂等,重复 up 直接跳过已应用项
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s

  admin-api:
    image: tillgate/admin-api:${TILLGATE_TAG:-local}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        APP: admin-api
    env_file:
      - path: ../.env
        required: true
    environment:
      NODE_ENV: production # 防 .env 的 dev 值覆盖镜像 ENV(pino-pretty worker 在 bundle 里崩溃)
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tillgate}
      TRUSTED_PROXY_HOPS: '1' # 经 FE BFF 透传的 XFF（右数第 1 跳 = 真实用户 IP）
      REDIS_URL: redis://:${REDIS_PASSWORD:-root123}@redis:6379
      OTEL_TRACES_MODE: 'off'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        # 空库起服务 = 启动期 DB 探测失败后的僵死态(不自动恢复,登录等服务全挂)——
        # 迁移链完成才放行后端服务;migrate 幂等,重复 up 直接跳过已应用项
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 15s

  worker:
    image: tillgate/worker:${TILLGATE_TAG:-local}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        APP: worker
    env_file:
      - path: ../.env
        required: true
    environment:
      NODE_ENV: production # 防 .env 的 dev 值覆盖镜像 ENV(pino-pretty worker 在 bundle 里崩溃)
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tillgate}
      REDIS_URL: redis://:${REDIS_PASSWORD:-root123}@redis:6379
      OTEL_TRACES_MODE: 'off'
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrate:
        # 空库起服务 = 启动期 DB 探测失败后的僵死态(不自动恢复,登录等服务全挂)——
        # 迁移链完成才放行后端服务;migrate 幂等,重复 up 直接跳过已应用项
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8792/readyz']
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s

  # 链路接收端（内网）：OTLP/HTTP JSON → PG trace_spans 日分区；
  # 各服务通过 OTEL_TRACES_MODE=otlp + endpoint 指向它（见下方 environment 注入）。
  trace-receiver:
    image: tillgate/trace-receiver:${TILLGATE_TAG:-local}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
      args:
        APP: trace-receiver
    env_file:
      - path: ../.env
        required: true
    environment:
      NODE_ENV: production # 防 .env 的 dev 值覆盖镜像 ENV(pino-pretty worker 在 bundle 里崩溃)
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tillgate}
      OTEL_TRACES_MODE: 'off' # 接收端自身不再导出（防自环）
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully # 同其余后端:迁移完成才启动(空库启动=僵死态)
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8793/readyz']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  console-client:
    image: tillgate/console-client:${TILLGATE_TAG:-local}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: apps/client/Dockerfile
    env_file:
      - path: ../.env
        required: true
    environment:
      NODE_ENV: production # 防 .env 的 dev 值覆盖镜像 ENV(Next standalone 以生产模式跑)
      # 后端（用户面 8081）
      CLIENT_API_BASE: http://client-api:8081
      TRUSTED_PROXY_HOPS: '1' # FE 在 nginx 后：解入站 XFF 供 BFF 透传给 API
    depends_on:
      - client-api
    restart: unless-stopped

  console-admin:
    image: tillgate/console-admin:${TILLGATE_TAG:-local}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: apps/admin/Dockerfile
    env_file:
      - path: ../.env
        required: true
    environment:
      NODE_ENV: production # 防 .env 的 dev 值覆盖镜像 ENV(Next standalone 以生产模式跑)
      # 后端（管理面 8082）
      ADMIN_API_BASE: http://admin-api:8082
      TRUSTED_PROXY_HOPS: '1' # FE 在 nginx 后：解入站 XFF 供 BFF 透传给 API
    depends_on:
      - admin-api
    restart: unless-stopped

  migrate:
    image: tillgate/migrate:${TILLGATE_TAG:-local}
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/Dockerfile.migrate
    env_file:
      - path: ../.env
        required: true
    environment:
      # 同其余服务:容器网地址覆盖 env_file 的宿主机形态(localhost 在容器内指向自身,
      # 缺此覆盖时 drizzle-kit 静默失败——进度条后 exit 1,库零表)
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-tillgate}
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  redis:
    image: redis:7-alpine
    # B3 修复：启用 requirepass（与 REDIS_URL 的密码对齐），生产 Redis 不裸奔。
    # REDIS_PASSWORD 来自 .env（默认 root123 仅开发；生产务必覆盖为强随机值）。
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD:-root123}']
    volumes:
      - redis-data:/data
    healthcheck:
      # 带鉴权 ping（requirepass 启用后无密码 ping 返回 NOAUTH）
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD:-root123}', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tillgate}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tillgate}']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis-data:
  pg-data:
  certbot-etc: # TLS 证书（/etc/letsencrypt）
  certbot-web: # certbot webroot 验证（/var/www/certbot）
