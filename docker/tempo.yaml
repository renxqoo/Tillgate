# Tempo v3 配置（链路追踪存储）
# v3 默认 block-retention=336h（14 天），此处仅配置必要项
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

# v3 默认保留 336h（14 天），无需显式配置 compactor
# 如需改保留期：用 CLI flag -backend-worker.compaction.block-retention=168h
