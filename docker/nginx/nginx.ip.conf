# IP 直连入口（无域名场景——配 compose.server.yml 使用）
#
# 当前形态：内网明文 HTTP（2026-08-28）
#   - 用户面板 + API：http://<ip>:80
#   - 管理后台：      http://<ip>:8443
#   原因：本机 colima 的端口转发层（ssh/grpc 同源）会损坏 Chromium 内核的
#   TLS 握手（ERR_SSL_PROTOCOL_ERROR，LibreSSL 系 curl 正常），内网明文
#   规避该缺陷。恢复 TLS 时：还原 443 ssl server 块 + compose.server.yml
#   证书挂载（git 历史），并先验证转发层 TLS 是否已修复。
#   已知限制：生产形态会话 Cookie 带 Secure 位（client-api 强制，不可关闭），
#   http://<内网IP> 来源浏览器会丢弃会话 Cookie——面板登录请用
#   http://localhost[:8443]（浏览器视 localhost 为可信来源）；网关 API
#   （Bearer Key）不受影响。
#
# 与 nginx.conf（域名 + Let's Encrypt）的差别：
#   - 无证书/certbot；刻意不加 HSTS
#   - 管理后台走独立端口 8443（无子域可用，与用户面 80 物理隔离）
#   - certbot 不启动（compose.server.yml 中归入 profile）

upstream gateway_upstream {
    server gateway:8080;
}

upstream client_api_upstream {
    server client-api:8081;
}

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

# 响应压缩（2026-08-25）：JS/CSS/JSON/SVG 等正文类资源透明 gzip（text/html 由
# gzip on 隐含覆盖——nginx 禁止在 gzip_types 重复声明 html）；proxied any 对
# 反代响应同样生效，Vary 头保 CDN/代理缓存键正确
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# 访问日志只记 URI 不记查询串（$uri 替代 $request_uri）——
# 查询串可能携带敏感参数（登录凭据 GET 提交、找回 token 等；凭据表单已改
# POST，此处再堵日志侧留痕）
log_format gateway_main '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status '
                        '$body_bytes_sent "$http_referer" "$http_user_agent"';
access_log /var/log/nginx/access.log gateway_main;

upstream console_client_upstream {
    server console-client:3001;
}

upstream console_admin_upstream {
    server console-admin:3002;
}

# ==================== HTTP 用户面板 + API（主入口 80，明文） ====================
server {
    listen 80;
    server_name _;

    client_max_body_size 16m;

    # 用户身份与支付回调属于 client-api，必须放在通用 /v1/ 规则之前
    location ^~ /v1/oauth/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://client_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location ~ ^/v1/payments/notify/(epay|stripe)$ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://client_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # 推理 API：/v1/* 与 /oauth/token
    location /v1/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        # 流式：不缓冲 + 读超时大于网关流式空闲阈值（5min）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location = /oauth/token {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/(livez|readyz)$ {
        proxy_pass http://gateway_upstream;
        access_log off;
    }

    # 用户面板（Next.js，console-client）
    location / {
        proxy_pass http://console_client_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}

# ==================== HTTP 管理后台（独立端口 8443，明文） ====================
# 无域名无法用子域分流，改独立端口；与用户面 80 物理隔离（会话 cookie 不同源）。
# 登录会话 Cookie 带 Secure 位：经 http://<内网IP>:8443 访问时浏览器会丢弃，
# 需登录请用 http://localhost:8443（可信来源例外）。
server {
    listen 8443;
    server_name _;

    client_max_body_size 16m;

    location / {
        proxy_pass http://console_admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
}
