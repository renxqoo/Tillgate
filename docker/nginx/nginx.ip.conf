# IP 直连入口（无域名场景——配 compose.server.yml 使用）
#
# 与 nginx.conf（域名 + Let's Encrypt）的差别：
#   - 证书：Let's Encrypt IP 证书（shortlived profile，6 天效期，需定期续期：
#     见 compose.server.yml certbot 注释——暂为手动续期）
#     docker run --rm -p 80:80 -v tillgate_certbot-etc:/etc/letsencrypt certbot/certbot \
#       certonly --standalone --cert-name gateway --ip-address <服务器IP> \
#       --required-profile shortlived --email <邮箱> --agree-tos --no-eff-email
#     （续期前停 nginx 释放 80；完成后 up -d nginx）
#   - 管理后台：无子域可用，走独立端口 8443（用户面板 443 / 管理后台 8443 天然隔离）
#   - 刻意不加 HSTS：IP 入口加 HSTS 会连带封锁同 IP 其它端口的 http 访问
#   - certbot 不启动（compose.server.yml 中归档进 profile）
# 后续有域名后：certbot 签发 → 切回 nginx.conf 即可，应用零改动。

upstream gateway_upstream {
    server gateway:8080;
}

upstream client_api_upstream {
    server client-api:8081;
}

limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

# 响应压缩（2026-08-25）：JS/CSS/JSON/SVG 等正文类资源透明 gzip（text/html 由
# gzip on 隐含覆盖——nginx 禁止在 gzip_types 重复声明 html）；proxied any 对
# 反代响应同样生效，Vary 头保 CDN/代理缓存键正确
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# 访问日志只记 URI 不记查询串（$uri 替代 $request_uri，与 dev-tls 同款防御）——
# 查询串可能携带敏感参数（登录凭据 GET 提交、找回 token 等；凭据表单已改
# POST，此处再堵日志侧留痕）
log_format gateway_main '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status '
                        '$body_bytes_sent "$http_referer" "$http_user_agent"';
access_log /var/log/nginx/access.log gateway_main;

upstream console_client_upstream {
    server console-client:3001;
}

upstream console_admin_upstream {
    server console-admin:3002;
}

# ==================== HTTPS 用户面板 + API（主入口 443） ====================
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/gateway/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 16m;

    # 用户身份与支付回调属于 client-api，必须放在通用 /v1/ 规则之前
    location ^~ /v1/oauth/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://client_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location ~ ^/v1/payments/notify/(epay|stripe)$ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://client_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location /v1/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location = /oauth/token {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/(livez|readyz)$ {
        proxy_pass http://gateway_upstream;
        access_log off;
    }

    location / {
        proxy_pass http://console_client_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# ==================== HTTPS 管理后台（独立端口 8443） ====================
# 无域名无法用子域分流，改独立端口；与用户面 443 物理隔离（会话 cookie 不同源）。
server {
    listen 8443 ssl http2;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/gateway/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 16m;

    location / {
        proxy_pass http://console_admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# ==================== HTTP 80（健康探测 + 重定向） ====================
server {
    listen 80;
    server_name _;

    location ~ ^/(livez|readyz)$ {
        proxy_pass http://gateway_upstream;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
