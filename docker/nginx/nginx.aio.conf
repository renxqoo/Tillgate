# Tillgate AIO 单容器 nginx 入口（主配置——经 `nginx -c` 直载，非 conf.d include，
# 须自带 events/http 块）。
# 与 docker/nginx/nginx.conf（域名 + certbot）的差别：
#   - 全部 upstream 指向容器内回环（单容器进程模型，无 docker DNS）
#   - 证书固定 /data/certs/tillgate.crt + tillgate.key（首启自签或用户放置的 origin 证书）
#   - 80 端口：/livez、/readyz 探活 + HTTP→HTTPS 跳转（LB 与健康检查不强制 TLS）
#   - 443：用户面板 + 推理 API（默认 server）；8443：管理后台（独立端口物理隔离）
#   - http2 用 1.25.1+ 的独立指令写法（listen 内联写法已废弃，避免启动告警噪音）

worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    upstream gateway_upstream {
        server 127.0.0.1:8080;
    }

    upstream client_api_upstream {
        server 127.0.0.1:8081;
    }

    upstream console_client_upstream {
        server 127.0.0.1:3001;
    }

    upstream console_admin_upstream {
        server 127.0.0.1:3002;
    }

    # 401 洪水外层闸：nginx 层按真实 remote_addr 限速兜底（与其余入口配置同款口径）
    limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;
    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        application/manifest+json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    # 访问日志只记 URI 不记查询串（查询串可能携带登录凭据/找回 token 等敏感参数）
    log_format gateway_main '$remote_addr - $remote_user [$time_local] '
                            '"$request_method $uri $server_protocol" $status '
                            '$body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /dev/stdout gateway_main;

    # ==================== HTTPS 用户面板 + 推理 API（主入口 443）====================
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /data/certs/tillgate.crt;
        ssl_certificate_key /data/certs/tillgate.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options nosniff always;

        client_max_body_size 16m;

        # 用户身份与支付回调属于 client-api，必须放在通用 /v1/ 规则之前
        location ^~ /v1/oauth/ {
            limit_req zone=api_per_ip burst=20 nodelay;
            proxy_pass http://client_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        location ~ ^/v1/payments/notify/(epay|stripe)$ {
            limit_req zone=api_per_ip burst=40 nodelay;
            proxy_pass http://client_api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
        }

        # 推理 API：/v1/* 与 /oauth/token
        location /v1/ {
            limit_req zone=api_per_ip burst=40 nodelay;
            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-Id $request_id;
            # 流式：不缓冲 + 读超时大于网关流式空闲阈值（5min）
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 360s;
            proxy_send_timeout 360s;
        }

        location = /oauth/token {
            limit_req zone=api_per_ip burst=20 nodelay;
            proxy_pass http://gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 用户面板（Next.js，console-client）；X-Forwarded-Proto/Host 供面板推导
        # 「Base URL/接口示例」，缺失会回落错协议
        location / {
            proxy_pass http://console_client_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ==================== HTTPS 管理后台（独立端口 8443）====================
    # 与用户面物理隔离（会话 cookie 不同源）。Host/X-Forwarded-Host 必须用 $http_host
    # （含端口）：$host 会剥端口，Next Server Actions 的 Origin 校验对不上非默认端口
    # 入口一律 Aborting → 页面 "A server error occurred"。
    server {
        listen 8443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /data/certs/tillgate.crt;
        ssl_certificate_key /data/certs/tillgate.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;

        add_header X-Content-Type-Options nosniff always;

        client_max_body_size 16m;

        location / {
            proxy_pass http://console_admin_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $http_host;
        }
    }

    # ==================== HTTP：探活 + 跳转（80）====================
    server {
        listen 80 default_server;
        server_name _;

        # 健康检查例外（HEALTHCHECK / LB 探测走 HTTP，不强制重定向）
        location ~ ^/(livez|readyz)$ {
            proxy_pass http://gateway_upstream;
            access_log off;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }
}
