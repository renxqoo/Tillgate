# LAN 开发 TLS 前门（代码零改动——见同目录 README-dev-tls.md）
#
# 用途：给本机直跑的 dev 服务（next dev / bun dev）补上浏览器↔服务端的加密通道，
#      登录密码、会话 Cookie、网关 API Key 不再走明文 HTTP。
# 端口：
#   https://<IP>:3443  → 127.0.0.1:3001  用户面板
#   https://<IP>:3444  → 127.0.0.1:3002  管理后台
#   https://<IP>:8443  → 127.0.0.1:8787  网关 /v1（API Key 也进 TLS）
# 刻意不加 HSTS：LAN IP + 多端口并存（3001/3002 明文口仍可用），
#      HSTS 按 host 生效会连带封锁同 IP 其它端口的 http 访问。
# 证书：mkcert（本地 CA，浏览器零告警）；私钥在 certs/（已 gitignore，不入库）。

worker_processes 1;
error_log logs/dev-tls-error.log;
pid logs/dev-tls-nginx.pid;

events {
    worker_connections 1024;
}

http {
    # 日志只记 URI 不记查询串（$uri 替代 $request_uri）——查询串可能携带
    # 凭证等敏感参数（登录页已做白名单重定向，此处再堵日志侧留痕）
    log_format dev_tls '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status '
                       '$body_bytes_sent "$http_referer" "$http_user_agent"';

    access_log logs/dev-tls-access.log dev_tls;

    # 登录/token 端点防爆破限速（与应用层守卫互补）
    limit_req_zone $binary_remote_addr zone=oauth_per_ip:10m rate=5r/s;

    # WebSocket Upgrade 透传映射（无 Upgrade 头时保持 close，HTTP/1.1 语义）
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # TLS（Mozilla intermediate；mkcert 证书本地信任）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:DEV_TLS:10m;
    ssl_session_timeout 1d;

    # 与网关 bodyLimit 对齐（/v1 多模态最大 16MB）
    client_max_body_size 16m;

    proxy_http_version 1.1;
    # $http_host 含端口（host:3444）：Next server action 校验 Host 与
    # 浏览器源一致，$host 会丢端口 → "Invalid Server Actions request"
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE 流式（网关 /v1 长连接）：关闭缓冲、拉长读超时
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    # WebSocket 升级（Next dev 的 /_next/hmr 热更新长连接；连接头透传）
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # ── 用户面板：https://<IP>:3443 ──
    server {
        listen 3443 ssl;
        server_name _;
        ssl_certificate certs/dev.pem;
        ssl_certificate_key certs/dev-key.pem;
        location / {
            proxy_pass http://127.0.0.1:3001;
        }
    }

    # ── 管理后台：https://<IP>:3444 ──
    server {
        listen 3444 ssl;
        server_name _;
        ssl_certificate certs/dev.pem;
        ssl_certificate_key certs/dev-key.pem;
        location / {
            proxy_pass http://127.0.0.1:3002;
        }
    }

    # ── 网关对外 API：https://<IP>:8443（/v1/* 与 /oauth/token）──
    server {
        listen 8443 ssl;
        server_name _;
        ssl_certificate certs/dev.pem;
        ssl_certificate_key certs/dev-key.pem;

        # 登录/token 端点防爆破限速（与应用层守卫互补）
        location /oauth/token {
            limit_req zone=oauth_per_ip burst=10 nodelay;
            proxy_pass http://127.0.0.1:8787;
        }
        location /v1/ {
            proxy_pass http://127.0.0.1:8787;
        }
        location / {
            proxy_pass http://127.0.0.1:8787;
        }
    }

}
