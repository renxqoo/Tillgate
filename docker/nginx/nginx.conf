# AI Gateway 统一入口
#
# TLS（tech-stack §7）：
#   - 443 server 块：证书在 /etc/letsencrypt/live/gateway/（certbot 容器签发）
#   - 80 server 块：301 重定向到 HTTPS（防降级攻击），/healthz 例外（LB 探测）
#   - HSTS：Strict-Transport-Security max-age=31536000
#
# 首次部署：先 certbot 签发证书，再启动（否则 nginx 因证书缺失启动失败）。
# 开发模式（无证书）：用 nginx.dev.conf 只听 80 端口。

upstream gateway_upstream {
    server gateway:8787;
}

upstream console_upstream {
    server console:3000;
}

# ==================== HTTPS（主入口） ====================
server {
    listen 443 ssl http2;
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/gateway/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway/privkey.pem;

    # TLS 安全配置（Mozilla intermediate 2024）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头（HSTS 防 SSL strip 降级攻击）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # 客户端请求体上限（与网关 bodyLimit 一致：16MB）
    client_max_body_size 16m;

    # 对外 API：/v1/* 与 /oauth/token
    location /v1/ {
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        # 流式：不缓冲 + 读超时大于网关流式空闲阈值（5min）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location = /oauth/token {
        proxy_pass http://gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        proxy_pass http://gateway_upstream;
        access_log off;
    }

    # 控制台（Next.js）
    location / {
        proxy_pass http://console_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ==================== HTTP → HTTPS 重定向（防降级攻击） ====================
server {
    listen 80;
    server_name _;

    # 健康检查例外（LB/compose 探测走 HTTP，不强制重定向）
    location = /healthz {
        proxy_pass http://gateway_upstream;
        access_log off;
    }

    # 其余全部 301 到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
