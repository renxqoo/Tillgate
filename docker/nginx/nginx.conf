# Tillgate 统一入口
#
# TLS（tech-stack §7）：
#   - 443 server 块：证书在 /etc/letsencrypt/live/gateway/（certbot 容器签发）
#   - 80 server 块：301 重定向到 HTTPS（防降级攻击），/livez 与 /readyz 供 LB 探测
#   - HSTS：Strict-Transport-Security max-age=31536000
#
# 前端分流（admin-api 拆分后，两个独立 Next.js app）：
#   - 用户面板（console-client:3001）：主入口，默认 location /
#   - 管理后台（console-admin:3002）：独立子域 admin.* 或路径 /admin（需 base path，暂用子域方案）
#
# 首次部署：先 certbot 签发证书，再启动（否则 nginx 因证书缺失启动失败）。
# 开发模式（无证书）：用 nginx.dev.conf 只听 80 端口。

upstream gateway_upstream {
    # 2026-08-20 v1 退役：生产入口切 gateway（用户已拍板删除 v1）
    server gateway:8080;
}

upstream client_api_upstream {
    server client-api:8081;
}

# 401 洪水外层闸（T6）：应用层 authfail 守卫按 XFF 首跳计数可被伪造绕过；
# nginx 层按真实 remote_addr 限速兜底（每 IP 20r/s，突发 40 排队，超出的 503）
limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

# 响应压缩（2026-08-25）：JS/CSS/JSON/SVG 等正文类资源透明 gzip（text/html 由
# gzip on 隐含覆盖——nginx 禁止在 gzip_types 重复声明 html）；proxied any 对
# 反代响应同样生效，Vary 头保 CDN/代理缓存键正确
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_comp_level 5;
gzip_proxied any;
gzip_types
    application/javascript
    application/json
    application/manifest+json
    application/xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# 访问日志只记 URI 不记查询串（$uri 替代 $request_uri，与 dev-tls 同款防御）——
# 查询串可能携带敏感参数（登录凭据 GET 提交、找回 token 等；凭据表单已改
# POST，此处再堵日志侧留痕）
log_format gateway_main '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status '
                        '$body_bytes_sent "$http_referer" "$http_user_agent"';
access_log /var/log/nginx/access.log gateway_main;

upstream console_client_upstream {
    server console-client:3001;
}

upstream console_admin_upstream {
    server console-admin:3002;
}

# ==================== HTTPS 用户面板（主入口） ====================
server {
    listen 443 ssl http2;
    # 主域名（用户面板）。管理员后台用 admin.* 子域（下方独立 server 块）。
    # 首次部署若只有一张证书，可统一用 _ 通配；多子域建议 certbot 签发 -d app.xxx -d admin.xxx
    server_name _;

    ssl_certificate     /etc/letsencrypt/live/gateway/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway/privkey.pem;

    # TLS 安全配置（Mozilla intermediate 2024）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全头（HSTS 防 SSL strip 降级攻击）
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    # 客户端请求体上限（与网关 bodyLimit 一致：16MB）
    client_max_body_size 16m;

    # 用户身份与支付回调属于 client-api。必须放在通用 /v1/ 规则之前，
    # OAuth provider 与支付平台只能访问公网入口，不能访问 Docker 内网服务名。
    location ^~ /v1/oauth/ {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://client_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    location ~ ^/v1/payments/notify/(epay|stripe)$ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://client_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # 推理 API：/v1/* 与 /oauth/token
    location /v1/ {
        limit_req zone=api_per_ip burst=40 nodelay;
        proxy_pass http://gateway_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        # 流式：不缓冲 + 读超时大于网关流式空闲阈值（5min）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }

    location = /oauth/token {
        limit_req zone=api_per_ip burst=20 nodelay;
        proxy_pass http://gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/(livez|readyz)$ {
        proxy_pass http://gateway_upstream;
        access_log off;
    }

    # 用户面板（Next.js，console-client）
    location / {
        proxy_pass http://console_client_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 面板「Base URL/接口示例」按请求头推导协议与主机——缺这两个头会回落错协议
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ==================== HTTPS 管理后台（独立子域 admin.*） ====================
# 部署时 certbot 需额外签发 -d admin.<domain>，并配 DNS 解析。
# Cookie 同域问题：子域间 cookie 默认不共享，符合「用户/管理员会话物理隔离」要求。
# 若希望同域共享，改用路径 /admin + Next.js basePath 配置（需额外改造前端）。
server {
    listen 443 ssl http2;
    server_name admin.*;

    ssl_certificate     /etc/letsencrypt/live/gateway/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 16m;

    # 管理后台（Next.js，console-admin）
    location / {
        proxy_pass http://console_admin_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}

# ==================== HTTP → HTTPS 重定向（防降级攻击） ====================
server {
    listen 80;
    server_name _;

    # 健康检查例外（LB/compose 探测走 HTTP，不强制重定向）
    location ~ ^/(livez|readyz)$ {
        proxy_pass http://gateway_upstream;
        access_log off;
    }

    # ACME webroot（certbot 首次签发/续期验证——必须在 301 之前直出，
    # 否则 challenge 被重定向到无证书的 443 = 首次签发死锁）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # 其余全部 301 到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}
